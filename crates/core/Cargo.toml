[package]
name = "coracle-core"
description = "AArch64 CPU and stage-1 MMU."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["threads"]
# Shared linear memory + Atomics.wait. Off for the Safari degraded build.
threads = []
# CDT trace emission (tests/EMULATOR_INTERFACE.md §1). Off in release builds.
trace = []
# Precise mode: route every FP operation through softfloat (docs/plan.md §2).
# Every differential FP leg builds with this.
fp-precise = []

# Native-only, tests-only: the CDT tests hand their stream to the differ that
# will consume it at the gate and read back its JSON.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_json = "1"

[lints]
workspace = true

[package]
name = "coracle-core"
description = "AArch64 CPU and stage-1 MMU."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# `kernels.rs` under benches/ is a module of the benchmark, not a benchmark
# itself; without this cargo builds it as its own target too.
autobenches = false

[features]
default = ["threads"]
# Shared linear memory + Atomics.wait. Off for the Safari degraded build.
threads = []
# CDT trace emission (tests/EMULATOR_INTERFACE.md §1). Off in release builds.
trace = []
# Precise mode: route every FP operation through softfloat (docs/plan.md §2).
# Every differential FP leg builds with this.
fp-precise = []

# Native-only, tests-only: the CDT tests hand their stream to the differ that
# will consume it at the gate and read back its JSON.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_json = "1"

# Throughput report, not a libtest harness: it prints MIPS and a pass/fail
# against the M1 gate. Native-only, as serde_json above is.
[[bench]]
name = "interp_mips"
harness = false

[lints]
workspace = true
